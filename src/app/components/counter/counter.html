<div class="col-sm-4 offset-4 border border-3 rounded-3 p-2 text-center">
  <h3>Counter example using NgRx</h3>

  <h4>Count: {{count$ | async}}</h4>

  <button class="btn btn-primary mx-1" (click)="decrement()">Decrement</button>
  <button class="btn btn-danger mx-1" (click)="reset()">Reset</button>
  <button class="btn btn-success mx-1" (click)="increment()">Increment</button>

</div>
